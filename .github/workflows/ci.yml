# Runs on the canonical repository at git.tanuki-cd.com (Forgejo Actions) and
# on its GitHub mirror. The *-hosted job needs GitHub's macOS, Windows and
# Arm runners, so it runs only on GitHub and is skipped on Forgejo.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.numpy }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10", numpy: "numpy==1.26.*" }
          - { os: ubuntu-latest, python: "3.12", numpy: "numpy" }
          - { os: ubuntu-latest, python: "3.14", numpy: "numpy" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.numpy }}"
          python -m pip install ".[test,benchmark]"
      - name: Test
        run: python -m pytest -q
      - name: Type-check and lint
        if: matrix.python == '3.12'
        run: |
          python -m pip install mypy ruff
          python -m mypy
          python -m ruff check src tests benchmarks tools setup.py
          python -m ruff format --check src tests benchmarks tools setup.py

  # Same install and test steps as python, on GitHub-hosted runners only.
  # The Arm runner is where the NEON kernels run on real hardware.
  python-hosted:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    if: github.server_url == 'https://github.com'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-24.04-arm, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,benchmark]"
      - name: Test
        run: python -m pytest -q

  kernels:
    name: Generated kernels and compiler warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check that the generated kernels are up to date
        run: python tools/generate_kernels.py --check
      - name: Check the vendored fastCD sources against their record
        run: python tools/vendor_fastcd.py --check
      - name: Compile without warnings under GCC and Clang
        run: |
          include="$(python -c 'import sysconfig; print(sysconfig.get_paths()["include"])')"
          for compiler in gcc clang; do
            "$compiler" -std=c11 -O3 -fno-fast-math -ffp-contract=off -fopenmp-simd \
              -Wall -Wextra -Wpedantic -Werror -fPIC -shared -I"$include" \
              -Ivendor/fastcd/include -DQ2N_FASTCD_SUM_SIMD=1 \
              src/inazumaq2n/_core.c -o "$RUNNER_TEMP/core-$compiler.so" -lm
          done

  # The q2n of the MATLAB pansharpening toolbox, run under GNU Octave from
  # files fetched at a pinned commit and verified by their SHA-256, against
  # the package. The files are not part of this repository.
  toolboxes:
    name: Agreement with the MATLAB toolbox under Octave
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Octave and the package
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends octave
          python -m pip install --upgrade pip
          python -m pip install ".[test,benchmark]"
      - name: Fetch the toolbox
        run: python benchmarks/toolboxes.py fetch matlab
      - name: Compare
        run: |
          python benchmarks/toolboxes.py status matlab
          python -m pytest -q -rs benchmarks/test_toolboxes.py

  archives:
    name: Benchmark and stability archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check the archives and the tables of docs/stability.md
        run: python tools/check_archives.py

  distributions:
    name: Source distribution and installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Set release paths outside the checkout
        run: printf 'RELEASE_DIR=%s/inazumaq2n-release\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build source distribution and wheel from it
        run: |
          python -m build --outdir "$RELEASE_DIR/dist"
          python -m twine check --strict "$RELEASE_DIR"/dist/*
      - name: Extract the source distribution
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          release = Path(os.environ["RELEASE_DIR"])
          with tarfile.open(next((release / "dist").glob("*.tar.gz"))) as archive:
              prefix = archive.getnames()[0].split("/", 1)[0]
              names = {member.name for member in archive.getmembers()}
              # Raw study data stays on the machine that produced it
              assert not any("/raw/" in name for name in names), "raw data in sdist"
              # Fetched toolbox sources are never distributed
              assert not any("/.toolboxes/" in name for name in names), "toolbox in sdist"
              for required in (
                  "src/inazumaq2n/_core.c",
                  "src/inazumaq2n/_isa.h",
                  "src/inazumaq2n/_prepare.h",
                  "src/inazumaq2n/_direct.h",
                  "src/inazumaq2n/_fused.h",
                  "vendor/fastcd/VENDORED.json",
                  "vendor/fastcd/LICENSE",
                  "vendor/fastcd/src/fastcd.c",
                  "vendor/fastcd/src/generated/fused_sum_kernels.h",
                  "tests/reference.py",
                  "tests/exact.py",
                  "benchmarks/baseline.py",
                  "benchmarks/toolbox.py",
                  "benchmarks/toolboxes.py",
                  "benchmarks/octave/run_q2n.m",
                  "benchmarks/octave/shims/mean2.m",
                  "tools/generate_kernels.py",
                  "tools/vendor_fastcd.py",
                  "tools/check_archives.py",
                  "docs/stability.md",
              ):
                  assert f"{prefix}/{required}" in names, required
              archive.extractall(release / "source", filter="data")
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              output.write(f"RELEASE_SOURCE={release / 'source' / prefix}\n")
          PY
      - name: Install wheel and test outside the checkout
        shell: bash
        run: |
          python -m pip install "$RELEASE_DIR"/dist/*.whl pytest threadpoolctl pyfastcd matplotlib
          cd "$RELEASE_SOURCE" || exit 1
          python tools/generate_kernels.py --check
          python tools/vendor_fastcd.py --check
          python tools/check_archives.py
          python -m pytest -q
